<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Weekly check-in</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#262c36;--tx:#e8ecf2;--mut:#8b94a3;--ac:#4cc38a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:16px 14px 90px;max-width:560px;margin:auto}
h1{font-size:22px;margin:6px 0 2px}p.s{color:var(--mut);margin:0 0 14px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0e1116;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
textarea{min-height:90px}.r{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.r .a{font-size:13px;color:var(--ac);padding-bottom:12px;text-align:center}.m{font-size:14px;margin-top:8px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#0e1116ee;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;max-width:560px;margin:auto}
button{flex:1;background:var(--ac);color:#062014;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600}button.g{background:#262c36;color:var(--tx)}
pre{white-space:pre-wrap;background:#0e1116;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;display:none}
</style></head><body>
<h1>Weekly check-in</h1><p class="s">Fill in, tap Summary, send it to Instinct for feedback. Saves on this phone as you type.</p>
<div id="app"></div><pre id="out"></pre>
<div class="bar"><button class="g" id="clr">Clear</button><button id="sum">Summary</button></div>
<script>
const $=s=>document.querySelector(s);const F={};
const meas=[["Weight","kg"],["Waist","cm"],["Chest","cm"],["Left bicep","cm"],["Left calf","cm"]];
const sc=n=>`<select id="${n}"><option value="">-</option>${[...Array(10)].map((_,i)=>`<option>${i+1}</option>`).join("")}</select>`;
const tx=(n,l,t="text")=>`<label>${l}</label><input id="${n}" type="${t}" inputmode="${t=='number'?'decimal':'text'}">`;
const ta=(n,l)=>`<label>${l}</label><textarea id="${n}"></textarea>`;
const op=(n,l,o)=>`<label>${l}</label><select id="${n}"><option value="">-</option>${o.map(x=>`<option>${x}</option>`).join("")}</select>`;
let h=`<section><h2>Date</h2><input id="date" type="date"></section>`;
h+=`<section><h2>1. Weigh-in &amp; measurements</h2>`+meas.map(([n,u],i)=>`<label>${n} (${u})</label><div class="r"><input id="m${i}a" type="number" step="any" inputmode="decimal" placeholder="Read 1"><input id="m${i}b" type="number" step="any" inputmode="decimal" placeholder="Read 2"><div class="a" id="m${i}v">avg -</div></div>`).join("")+`</section>`;
h+=`<section><h2>2. Heart rate, activity &amp; hydration</h2>${tx("hrmin","Minimum HR (bpm)","number")}${tx("hrmax","Maximum HR (bpm)","number")}${tx("hrrest","Resting HR (bpm or range)")}${tx("steps","Average daily steps","number")}${tx("fluid","Average fluids (L/day)","number")}</section>`;
h+=`<section><h2>3. Nutrition (MyFitnessPal daily averages)</h2><div class="m" style="color:var(--mut)">Targets: 1800 kcal, 135 g carbs, 70 g fat, 158 g protein</div>${tx("cal","Calories (kcal)","number")}${tx("pro","Protein (g)","number")}${tx("carb","Carbs (g)","number")}${tx("fat","Fat (g)","number")}${tx("protdays","Days hitting protein target (of 7)","number")}${tx("fibre","Fibre (g)","number")}${op("cyc","Calorie cycling",["Eating flexibly","Strict cycling","Not cycling"])}${op("fast","Fasting",["Not fasting","Intermittent fasting","Extended fast"])}${op("anx","Food anxiety / urge to compensate",["None this week","Mild","Moderate","Strong"])}${tx("supp","Supplements","text")}${ta("mfp","MyFitnessPal diary notes (paste if you want)")}</section>`;
h+=`<section><h2>4. Training (Strong)</h2>${tx("wk","Workouts completed","number")}${op("str","Overall strength",["Stronger","About the same","Weaker"])}${op("ret","Return-to-training status",["Returned to normal training","Returning gradually","Not training"])}${ta("wo","Paste Strong workouts (all of them)")}${ta("prs","PRs from Strong this week")}${ta("won","Workout notes")}</section>`;
h+=`<section><h2>5. Recovery &amp; sleep</h2><label>Physical energy /10</label>${sc("en")}<label>Hunger /10</label>${sc("hun")}<label>Sleep quality /10</label>${sc("sq")}${tx("sd","Average sleep duration (hours)")}${ta("sore","Soreness / recovery")}${op("chest","Chest symptoms since medical clearance",["No symptoms","Mild symptoms","Symptoms - need advice"])}</section>`;
h+=`<section><h2>6. Stress &amp; mental wellbeing</h2><label>Stress level /10</label>${sc("st")}<label>Mental energy / motivation /10</label>${sc("me")}${op("how","How often stressed",["Rarely","Some days","Most days","Every day"])}${tx("src","Main sources of stress")}${op("enj","Enjoyment of everyday activities",["Enjoying things as usual","A bit less","Much less"])}</section>`;
h+=`<section><h2>7. Wrap-up &amp; next week</h2>${tx("focus","Next week's focus")}${ta("extra","Anything else for Instinct")}</section>`;
$("#app").innerHTML=h;
const ids=[...document.querySelectorAll("input,select,textarea")];
const KEY="ds_gym_checkin";let S={};try{S=JSON.parse(localStorage[KEY]||"{}")}catch(e){}
if(!S.date){S.date=new Date().toLocaleDateString("en-CA")}
ids.forEach(e=>{if(S[e.id]!=null)e.value=S[e.id];e.addEventListener("input",()=>{S[e.id]=e.value;localStorage[KEY]=JSON.stringify(S);avg()})});
function v(i){return $("#"+i).value.trim()}
function avg(){meas.forEach((_,i)=>{const a=parseFloat(v("m"+i+"a")),b=parseFloat(v("m"+i+"b"));const x=[a,b].filter(n=>!isNaN(n));$("#m"+i+"v").textContent=x.length?"avg "+(x.reduce((p,c)=>p+c)/x.length).toFixed(1).replace(/\.0$/,""):"avg -"})}
avg();
const L=(k,x,u="")=>x?`- ${k}: ${x}${u}\n`:"";
function build(){let t=`WEEKLY CHECK-IN FOR MY TRAINER\nDate: ${v("date")}\n\n1. WEIGH-IN & MEASUREMENTS (average of 2 readings)\n`;
meas.forEach(([n,u],i)=>{const a=v("m"+i+"a"),b=v("m"+i+"b");const x=[a,b].map(parseFloat).filter(n=>!isNaN(n));if(x.length)t+=`- ${n}: ${(x.reduce((p,c)=>p+c)/x.length).toFixed(1).replace(/\.0$/,"")} ${u} (readings: ${[a,b].filter(Boolean).join(", ")})\n`});
t+=`\n2. HEART RATE, ACTIVITY & HYDRATION\n`+L("Minimum HR",v("hrmin")," bpm")+L("Maximum HR",v("hrmax")," bpm")+L("Resting HR",v("hrrest")," bpm")+L("Average daily steps",v("steps"))+L("Average fluids",v("fluid")," L/day");
t+=`\n3. NUTRITION (MyFitnessPal daily averages)\n`+L("Calories",v("cal")," kcal")+L("Protein",v("pro")," g")+L("Carbs",v("carb")," g")+L("Fat",v("fat")," g")+L("Days hitting protein target",v("protdays")?v("protdays")+"/7":"")+L("Fibre",v("fibre")," g")+L("Calorie cycling",v("cyc"))+L("Fasting",v("fast"))+L("Food anxiety / urge to compensate",v("anx"))+L("Supplements",v("supp"));
if(v("mfp"))t+=`\nMyFitnessPal diary notes:\n${v("mfp")}\n`;
t+=`\n4. TRAINING (Strong)\n`+L("Workouts completed",v("wk"))+L("Overall strength",v("str"))+L("Return-to-training status",v("ret"));
if(v("wo"))t+=`\n${v("wo")}\n`;
if(v("prs"))t+=`\nPRs from Strong this week:\n${v("prs")}\n`;
if(v("won"))t+=`\nWorkout notes:\n${v("won")}\n`;
t+=`\n5. RECOVERY & SLEEP\n`+L("Physical energy",v("en"),"/10")+L("Hunger",v("hun"),"/10")+L("Sleep quality",v("sq"),"/10")+L("Average sleep duration",v("sd")," Hours")+L("Soreness / recovery",v("sore"))+L("Chest symptoms since medical clearance",v("chest"));
t+=`\n6. STRESS & MENTAL WELLBEING\n`+L("Stress level",v("st"),"/10")+L("Mental energy / motivation",v("me"),"/10")+L("How often stressed",v("how"))+L("Main sources of stress",v("src"))+L("Enjoyment of everyday activities",v("enj"));
t+=`\n7. WRAP-UP & NEXT WEEK\n`+L("Next week's focus",v("focus"))+L("Anything else",v("extra"));return t}
$("#sum").onclick=async()=>{const t=build(),o=$("#out");o.textContent=t;o.style.display="block";o.scrollIntoView({behavior:"smooth"});
try{await navigator.clipboard.writeText(t);$("#sum").textContent="Copied - paste to Instinct"}catch(e){$("#sum").textContent="Select and copy above"}setTimeout(()=>$("#sum").textContent="Summary",3500)};
$("#clr").onclick=()=>{if(confirm("Clear the form?")){localStorage.removeItem(KEY);location.reload()}};
</script></body></html>
